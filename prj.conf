# Button and LED library
CONFIG_DK_LIBRARY=n

CONFIG_LED=y
CONFIG_GPIO=y
CONFIG_GPIO_HOGS=y
CONFIG_I2C=y
CONFIG_SENSOR=y

CONFIG_SPI=y

#LOGGING
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_DEBUG=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_UART_ASYNC_API=y
# CONFIG_LOG_BACKEND_UART_ASYNC=n
# CONFIG_LOG_BACKEND_UART_BUFFER_SIZE=256
# CONFIG_LOG_BACKEND_UART_AUTOSTART=y
CONFIG_PRINTK=y
CONFIG_USE_SEGGER_RTT=n
CONFIG_LOG_BACKEND_RTT=n
CONFIG_SHELL=y
CONFIG_I2C_SHELL=y

# Enable floating point
CONFIG_FPU=y
CONFIG_FP_HARDABI=y

# Enable pin control
CONFIG_PINCTRL=y

CONFIG_REGULATOR=y

CONFIG_GPIO_NRFX=y
# Added from the code block
# CONFIG_GPIO_NRFX=y
# CONFIG_NRFX_CLOCK=y

# Enable nrfx SPIM driver
# CONFIG_NRFX_SPIM=y

#BLE
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Sens Wear (OOB)"
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

# M95P EEPROM filesystem (LittleFS over a disk-access block device)
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FS_LITTLEFS_BLK_DEV=y
# The block-device backend uses the M95P's 512-byte logical sector as its
# read/program granularity, so each LittleFS cache must hold at least one sector.
CONFIG_FS_LITTLEFS_CACHE_SIZE=512
CONFIG_DISK_ACCESS=y
CONFIG_SENSWEAR_M95P_DISK=y
CONFIG_SENSWEAR_M95P_DISK_AUTOMOUNT=y

# POSIX layer for file operations on the mounted filesystem. POSIX_API provides
# open()/read()/write()/close() (routed to the filesystem via ZVFS) and selects
# the ZVFS file-descriptor table they use. CONFIG_ZVFS_OPEN_MAX bounds the number
# of simultaneously open descriptors.
CONFIG_POSIX_API=y
CONFIG_ZVFS_OPEN_MAX=8

# Increase stack size for the main thread and System Workqueue
CONFIG_BT_HCI_TX_STACK_SIZE_WITH_PROMPT=y
CONFIG_THREAD_NAME=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=4096

CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_BT_L2CAP_TX_MTU=512
CONFIG_BT_BUF_ACL_RX_SIZE=516
CONFIG_BT_BUF_ACL_TX_SIZE=516

CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# Device manager: drains the shared device event queue and publishes decoded
# per-message-type streams over zbus. The Bluetooth GATT services
# (src/bluetooth/services) subscribe to these streams, so the application
# image requires it (selects ZBUS and SENSWEAR_DEVICE_DRIVER_EVENTS).
CONFIG_SENSWEAR_DEVICE_MANAGER=y
