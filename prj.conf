# Button and LED library
CONFIG_DK_LIBRARY=n

CONFIG_LED=y
CONFIG_GPIO=y
CONFIG_GPIO_HOGS=y
CONFIG_I2C=y
CONFIG_SENSOR=y

CONFIG_SPI=y

#LOGGING
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_DEBUG=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_UART_AUTOSTART=y
CONFIG_PRINTK=y
CONFIG_USE_SEGGER_RTT=n
CONFIG_LOG_BACKEND_RTT=n
CONFIG_SHELL=y
CONFIG_I2C_SHELL=y

# Enable floating point
CONFIG_FPU=y
CONFIG_FP_HARDABI=y

# Enable pin control
CONFIG_PINCTRL=y

CONFIG_REGULATOR=y

CONFIG_GPIO_NRFX=y
# Added from the code block
# CONFIG_GPIO_NRFX=y
# CONFIG_NRFX_CLOCK=y

# Enable nrfx SPIM driver
# CONFIG_NRFX_SPIM=y

#BLE
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Sens Wear (Regulator)"
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

# M95P EEPROM filesystem (LittleFS over a disk-access block device)
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FS_LITTLEFS_BLK_DEV=y
CONFIG_DISK_ACCESS=y
CONFIG_SENSEWEAR_M95P_DISK=y
CONFIG_SENSEWEAR_M95P_DISK_AUTOMOUNT=y

# Increase stack size for the main thread and System Workqueue
CONFIG_BT_HCI_TX_STACK_SIZE_WITH_PROMPT=y
CONFIG_THREAD_NAME=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=4096

CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_BT_L2CAP_TX_MTU=512
CONFIG_BT_BUF_ACL_RX_SIZE=516
CONFIG_BT_BUF_ACL_TX_SIZE=516

CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
