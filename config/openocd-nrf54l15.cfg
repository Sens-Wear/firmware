# Common SenseWear nRF54L15 CPUAPP target configuration. Load one adapter
# configuration before this file.
source [find target/nordic/nrf54l.cfg]

adapter speed 1000
targets nrf54l.cpu

# nRF54L15 uses RRAM without an OpenOCD flash bank. Disable the generated GDB
# memory map so the debugger honors launch.json's read-only code region and
# uses hardware breakpoints.
gdb memory_map disable
gdb flash_program disable

# Enable the RRAM controller before image programming.
nrf54l.cpu configure -event reset-init {
	mww 0x5004b500 0x101
}

proc nrf54l-load {file} {
	mww 0x5004b500 0x101
	load_image $file
}
